# =====================================================================
# Timer-Ersatzplatine: ESP32-C3 Super Mini + OLED 0,91" + PhotoMOS
# Pinbelegung passend zum KiCad-Schaltplan timer_ersatzplatine.kicad_sch
#   Taster T1/T2/T3: GPIO3 / GPIO4 / GPIO5 (gegen GND, interne Pullups)
#   PhotoMOS (-> Shelly SW): GPIO6 (ueber 330R an LED-Anode)
#   I2C OLED: SDA=GPIO8, SCL=GPIO9
# =====================================================================

esphome:
  name: timer-relais
  friendly_name: Timer-Relais
  includes:
    - timer_web.h
  on_boot:
    # Eigene Web-App + JSON-API als Handler an web_server_base haengen.
    # Zeiger auf die ESPHome-Entitaeten werden hier gesetzt (id() ist nur
    # im Lambda verfuegbar) und im Handler benutzt.
    priority: -100
    then:
      - lambda: |-
          auto *h = new esphome::TimerWebHandler();
          h->time1 = id(time1);
          h->time2 = id(time2);
          h->time3 = id(time3);
          h->relay = id(shelly_trigger);
          h->remaining = &id(remaining);
          h->rssi = id(wifi_rssi);
          h->uptime = id(uptime_s);
          h->ip = id(ip_addr);
          h->ssid = id(wifi_ssid_txt);
          h->mac = id(wifi_mac_txt);
          id(web_base)->add_handler(h);

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Timer-Relais Setup"
    password: "timer1234"

captive_portal:

# Kein natives web_server-UI mehr: die eigene Mobil-App/JSON-API laeuft auf
# web_server_base (Port 80, Default). captive_portal + OTA nutzen die Basis mit.
web_server_base:
  id: web_base

number:
  - platform: template
    name: "Zeit Taster 1"
    id: time1
    icon: mdi:timer-outline
    unit_of_measurement: "s"
    min_value: 1
    max_value: 600
    step: 1
    initial_value: 5
    restore_value: true
    optimistic: true
    mode: box
  - platform: template
    name: "Zeit Taster 2"
    id: time2
    icon: mdi:timer-outline
    unit_of_measurement: "s"
    min_value: 1
    max_value: 600
    step: 1
    initial_value: 10
    restore_value: true
    optimistic: true
    mode: box
  - platform: template
    name: "Zeit Taster 3"
    id: time3
    icon: mdi:timer-outline
    unit_of_measurement: "s"
    min_value: 1
    max_value: 600
    step: 1
    initial_value: 15
    restore_value: true
    optimistic: true
    mode: box

globals:
  - id: remaining
    type: int
    restore_value: no
    initial_value: '0'

switch:
  - platform: gpio
    pin: GPIO6
    id: shelly_trigger
    name: "Shelly-Trigger"
    restore_mode: ALWAYS_OFF

script:
  - id: start_timer
    mode: restart
    parameters:
      seconds: int
    then:
      - lambda: 'id(remaining) = seconds;'
      - switch.turn_on: shelly_trigger
      - component.update: oled

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(remaining) > 0) {
            id(remaining) -= 1;
            if (id(remaining) <= 0) {
              id(remaining) = 0;
              id(shelly_trigger).turn_off();
            }
          }
      - component.update: oled

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO3
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Taster 1"
    filters:
      - delayed_on: 30ms
    on_press:
      - script.execute:
          id: start_timer
          seconds: !lambda 'return (int) id(time1).state;'
  - platform: gpio
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Taster 2"
    filters:
      - delayed_on: 30ms
    on_press:
      - script.execute:
          id: start_timer
          seconds: !lambda 'return (int) id(time2).state;'
  - platform: gpio
    pin:
      number: GPIO5
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Taster 3"
    filters:
      - delayed_on: 30ms
    on_press:
      - script.execute:
          id: start_timer
          seconds: !lambda 'return (int) id(time3).state;'

# Diagnose-Werte fuer die Status-/Netzwerk-Seite der Web-App (und HA/ioBroker)
sensor:
  - platform: wifi_signal
    name: "WLAN-Signal"
    id: wifi_rssi
    update_interval: 10s
    entity_category: diagnostic
  - platform: uptime
    name: "Laufzeit"
    id: uptime_s
    update_interval: 10s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"
      id: ip_addr
    ssid:
      name: "WLAN-SSID"
      id: wifi_ssid_txt
    mac_address:
      name: "MAC-Adresse"
      id: wifi_mac_txt

i2c:
  sda: GPIO8
  scl: GPIO9
  frequency: 400kHz

font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 24
  - file: "gfonts://Roboto"
    id: font_small
    size: 10

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x32"
    address: 0x3C
    id: oled
    update_interval: never
    lambda: |-
      if (id(remaining) > 0) {
        it.printf(0, 16, id(font_small), TextAlign::CENTER_LEFT, "Aktiv");
        it.printf(128, 16, id(font_big), TextAlign::CENTER_RIGHT, "%d s", id(remaining));
      } else {
        it.printf(64, 16, id(font_big), TextAlign::CENTER, "ON");
      }
