# =====================================================================
# Timer-Ersatzplatine: ESP32-C3 Super Mini + OLED 0,91" + PhotoMOS
# Pinbelegung passend zum KiCad-Schaltplan timer_ersatzplatine.kicad_sch
#   Taster S1/S2/S3 = Down/Manual / SET / UP: GPIO3 / GPIO4 / GPIO5
#     (gegen GND, interne Pullups)
#   PhotoMOS (-> Shelly SW): GPIO6 (ueber 330R an LED-Anode)
#   I2C OLED: SDA=GPIO7, SCL=GPIO9  (SDA war GPIO8 - kollidiert mit der RGB-LED!)
#   RGB-Status-LED (WS2812, onboard Super Mini): GPIO8
# =====================================================================

esphome:
  name: feeder-relais
  friendly_name: Feeder-Relais
  includes:
    - net_config.h
    - log_ring.h
    - help_content.h
    - timer_web.h
  on_boot:
    # Netzwerk-Konfig laden + anwenden, dann Web-App-Handler registrieren.
    priority: -100
    then:
      - lambda: |-
          esphome::netcfg_load();
          esphome::netcfg_apply_ntp();
          esphome::netcfg_apply_hostname();
          esphome::netcfg_apply_roaming();
          auto *h = new esphome::TimerWebHandler();
          h->time1 = id(time1);
          h->time2 = id(time2);
          h->time3 = id(time3);
          h->relay = id(shelly_trigger);
          h->remaining = &id(remaining);
          h->rssi = id(wifi_rssi);
          h->uptime = id(uptime_s);
          h->ip = id(ip_addr);
          h->ssid = id(wifi_ssid_txt);
          h->mac = id(wifi_mac_txt);
          h->oled = id(oled);
          id(web_base)->add_handler(h);
          // WICHTIG: ohne natives web_server-UI startet den HTTP-Listener
          // (Port 80) sonst niemand im STA-Betrieb -> hier selbst initialisieren.
          id(web_base)->init();

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
  level: DEBUG            # bis DEBUG erfassen; Anzeige-Stufe waehlt man im Service-Tab
  on_message:
    # jede Log-Zeile in den Ringpuffer (aktiviert zugleich die Log-Listener)
    - lambda: 'esphome::log_ring_push(level, tag, message);'

api:

ota:
  - platform: esphome
  - platform: web_server   # Firmware-Upload per Browser: POST /update (Port 80)

wifi:
  # KEINE einkompilierten Zugangsdaten! Einrichtung ausschliesslich ueber das
  # Setup-AP/Captive-Portal. Vorteile:
  #  1) Auslieferung ohne fremden WLAN-Namen/-Passwort im Image.
  #  2) has_sta()==false -> die per Portal gespeicherten Daten liegen unter
  #     einem FESTEN Preference-Key (88491487) und ueberleben OTA-Updates
  #     (mit einkompiliertem WLAN haengt der Key am Config-Hash -> geht verloren).
  # Werksreset (keine alten Daten): Factory-Image MIT Flash-Erase flashen.
  power_save_mode: none
  # 802.11k/v (RRM/BTM) fest EINKOMPILIEREN (CONFIG_WPA_11KV_SUPPORT). Das ist
  # nur die Faehigkeit - das tatsaechliche Ein/Aus schaltet net_config.h zur
  # Laufzeit (set_btm/set_rrm), gesteuert per Web (Netzwerk-Tab, g_netcfg.roaming).
  enable_btm: true
  enable_rrm: true
  ap:
    ssid: "Feeder-Relais Setup"
    password: "feeder1234"
  on_connect:
    # Nach jedem Verbinden: statische IP + Hostname (DHCP-Name) erneut setzen
    # (per ESP-IDF-netif; DHCP ist Default, statisch wird nach Neustart aktiv).
    - lambda: |-
        esphome::netcfg_apply_static();
        esphome::netcfg_apply_hostname();

captive_portal:

# mDNS explizit (feeder-relais.local); noetig fuer die Laufzeit-Umbenennung
# via mdns_hostname_set() in net_config.h.
mdns:

# Kein natives web_server-UI mehr: die eigene Mobil-App/JSON-API laeuft auf
# web_server_base (Port 80, Default). captive_portal + OTA nutzen die Basis mit.
web_server_base:
  id: web_base

# Uhrzeit per NTP (Default de.pool.ntp.org; NTP-Server spaeter per Web - Stufe B)
time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Berlin"
    servers:
      - de.pool.ntp.org

number:
  - platform: template
    name: "Zeit Taster 1"
    id: time1
    icon: mdi:timer-outline
    unit_of_measurement: "s"
    min_value: 1
    max_value: 600
    step: 1
    initial_value: 5
    restore_value: true
    optimistic: true
    mode: box
  - platform: template
    name: "Zeit Taster 2"
    id: time2
    icon: mdi:timer-outline
    unit_of_measurement: "s"
    min_value: 1
    max_value: 600
    step: 1
    initial_value: 10
    restore_value: true
    optimistic: true
    mode: box
  - platform: template
    name: "Zeit Taster 3"
    id: time3
    icon: mdi:timer-outline
    unit_of_measurement: "s"
    min_value: 1
    max_value: 600
    step: 1
    initial_value: 15
    restore_value: true
    optimistic: true
    mode: box

globals:
  - id: remaining          # Restsekunden des laufenden Timers (0 = aus)
    type: int
    restore_value: no
    initial_value: '0'
  - id: ui_mode            # 0 = Normal (Uhr/Timer), 1 = Menue
    type: int
    restore_value: no
    initial_value: '0'
  - id: menu_page          # aktuelle Menue-Infoseite (0..3)
    type: int
    restore_value: no
    initial_value: '0'
  - id: press_ms           # Zeitstempel des letzten Tastendrucks (fuer Langdruck)
    type: uint32_t
    restore_value: no
    initial_value: '0'

switch:
  - platform: gpio
    pin: GPIO6
    id: shelly_trigger
    name: "Shelly-Trigger"
    restore_mode: ALWAYS_OFF

script:
  - id: ui_timeout
    # 10 s ohne Tastendruck -> zurueck in den Normalzustand (Menue verlassen)
    mode: restart
    then:
      - delay: 10s
      - lambda: 'id(ui_mode) = 0; id(menu_page) = 0;'
      - component.update: oled

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(remaining) > 0) {
            id(remaining) -= 1;
            if (id(remaining) <= 0) {
              id(remaining) = 0;
              id(shelly_trigger).turn_off();
            }
          }
          if (esphome::g_prefs_save_pending) { esphome::g_prefs_save_pending = false; esphome::netcfg_flush(); }
          if (esphome::g_reconnect_pending) { esphome::g_reconnect_pending = false; esphome::netcfg_wifi_reconnect(); }
          if (esphome::g_reboot_pending) { App.safe_reboot(); }
          // Status-LED: gelb=Timer laeuft (Vorrang, wie WebUI-Punkt), rot=Stoerung
          // (nur im Ruhezustand), gruen=OK. Helligkeit aus g_netcfg.led_bri (WebUI-Regler).
          {
            float r = 0, g = 0, b = 0;
            bool fault = id(oled).is_failed() ||
                         !esphome::wifi::global_wifi_component->is_connected();
            if (id(remaining) > 0) { r = 1; g = 1; }   // gelb: Timer laeuft (Vorrang)
            else if (fault) r = 1;                       // rot: Stoerung (nur im Ruhezustand)
            else g = 1;                                  // gruen: OK
            auto c = id(status_led).turn_on();
            c.set_rgb(r, g, b);
            c.set_brightness(esphome::g_netcfg.led_bri / 100.0f);  // WebUI-Regler
            c.set_transition_length(0);
            c.perform();
          }
      - component.update: oled

binary_sensor:
  # S1 = Down / Manual : kurz -> Timer 1 (im Menue: vorblaettern)
  - platform: gpio
    pin:
      number: GPIO3
      mode:
        input: true
        pullup: true
      inverted: true
    name: "S1 Down-Manual"
    id: btn_s1
    filters:
      - delayed_on: 30ms
    on_press:
      - lambda: 'id(press_ms) = millis();'
    on_release:
      - lambda: |-
          if (id(ui_mode) == 0) {                 // Normal: Timer 1 ausloesen
            id(remaining) = (int) id(time1).state;
            id(shelly_trigger).turn_on();
          } else {                                // Menue: vorblaettern
            id(menu_page) = (id(menu_page) + 1) % 4;
          }
      - script.execute: ui_timeout
      - component.update: oled

  # S2 = SET : kurz -> Timer 2 (im Menue: schliessen) ; lang >=3 s -> Menue
  - platform: gpio
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true
    name: "S2 SET"
    id: btn_s2
    filters:
      - delayed_on: 30ms
    on_press:
      - lambda: 'id(press_ms) = millis();'
    on_release:
      - lambda: |-
          uint32_t dur = millis() - id(press_ms);
          if (dur >= 3000) {                      // langer Druck: Menue umschalten
            id(ui_mode) = (id(ui_mode) == 0) ? 1 : 0;
            id(menu_page) = 0;
          } else if (id(ui_mode) == 0) {          // kurz, Normal: Timer 2
            id(remaining) = (int) id(time2).state;
            id(shelly_trigger).turn_on();
          } else {                                // kurz, im Menue: schliessen
            id(ui_mode) = 0;
            id(menu_page) = 0;
          }
      - script.execute: ui_timeout
      - component.update: oled

  # S3 = UP : kurz -> Timer 3 (im Menue: zurueckblaettern) ; lang >=1,2 s -> alles STOP
  - platform: gpio
    pin:
      number: GPIO5
      mode:
        input: true
        pullup: true
      inverted: true
    name: "S3 UP"
    id: btn_s3
    filters:
      - delayed_on: 30ms
    on_press:
      - lambda: 'id(press_ms) = millis();'
    on_release:
      - lambda: |-
          uint32_t dur = millis() - id(press_ms);
          if (id(ui_mode) == 1) {                 // Menue: zurueckblaettern
            id(menu_page) = (id(menu_page) + 3) % 4;
          } else if (dur >= 1200) {               // Normal + lang: alle Timer STOP
            id(remaining) = 0;
            id(shelly_trigger).turn_off();
          } else {                                // Normal + kurz: Timer 3
            id(remaining) = (int) id(time3).state;
            id(shelly_trigger).turn_on();
          }
      - script.execute: ui_timeout
      - component.update: oled

# Diagnose-Werte fuer die Status-/Netzwerk-Seite der Web-App (und HA/ioBroker)
sensor:
  - platform: wifi_signal
    name: "WLAN-Signal"
    id: wifi_rssi
    update_interval: 10s
    entity_category: diagnostic
  - platform: uptime
    name: "Laufzeit"
    id: uptime_s
    update_interval: 10s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"
      id: ip_addr
    ssid:
      name: "WLAN-SSID"
      id: wifi_ssid_txt
    mac_address:
      name: "MAC-Adresse"
      id: wifi_mac_txt

i2c:
  sda: GPIO7            # war GPIO8 -> dort sitzt die Onboard-RGB-LED (WS2812)
  scl: GPIO9
  frequency: 400kHz

# Onboard-RGB-LED (WS2812 auf GPIO8) als dezente Status-LED (gedimmt).
# Wird im 1s-Interval gesetzt: gruen=OK, gelb=Timer laeuft, rot=Stoerung.
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: "Status-LED"
    internal: true
    pin: GPIO8
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

font:
  - file: "gfonts://Roboto"
    id: font_big
    size: 24
  - file: "gfonts://Roboto"
    id: font_small
    size: 10

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x32"
    address: 0x3C
    rotation: 180°          # Display ist um 180° verdreht montiert -> in Software gedreht
    id: oled
    update_interval: never
    lambda: |-
      // ----- WLAN-Balken oben links (x 0..11) -----
      bool conn = esphome::wifi::global_wifi_component->is_connected();
      int rssi = id(wifi_rssi).has_state() ? (int) id(wifi_rssi).state : -100;
      int bars = 0;
      if (conn) {
        if (rssi >= -55) bars = 4; else if (rssi >= -65) bars = 3;
        else if (rssi >= -75) bars = 2; else bars = 1;
      }
      for (int i = 0; i < 4; i++) {
        int h = 2 + i * 2;
        if (i < bars) it.filled_rectangle(i * 3, 9 - h, 2, h);
        else          it.rectangle(i * 3, 9 - h, 2, h);
      }
      if (!conn) it.line(0, 1, 11, 9);

      // Sprache (0=de,1=en,2=fr,3=nl,4=es,5=it); OLED-Texte bewusst akzentfrei
      int L = esphome::netcfg_lang_idx();
      if (id(ui_mode) == 1) {
        // ----- Menue: Info-Seiten (nur Ansicht) -----
        static const char *const M_WIFI[]  = {"WLAN", "Wi-Fi", "Wi-Fi", "Wi-Fi", "Wi-Fi", "Wi-Fi"};
        static const char *const M_IP[]    = {"IP-Adresse", "IP address", "Adresse IP", "IP-adres", "Direccion IP", "Indirizzo IP"};
        static const char *const M_TIME[]  = {"Zeit / NTP", "Time / NTP", "Heure / NTP", "Tijd / NTP", "Hora / NTP", "Ora / NTP"};
        static const char *const M_SYS[]   = {"System", "System", "Systeme", "Systeem", "Sistema", "Sistema"};
        static const char *const M_NOSYNC[]= {"nicht synchron", "not synced", "non synchro", "niet gesync.", "sin sincron.", "non sincron."};
        int pg = id(menu_page);
        it.printf(128, 0, id(font_small), TextAlign::TOP_RIGHT, "%d/4", pg + 1);
        if (pg == 0) {
          it.printf(16, 0, id(font_small), TextAlign::TOP_LEFT, "%s", M_WIFI[L]);
          it.printf(0, 11, id(font_small), TextAlign::TOP_LEFT, "%s",
                    id(wifi_ssid_txt).state.empty() ? "-" : id(wifi_ssid_txt).state.c_str());
          it.printf(0, 22, id(font_small), TextAlign::TOP_LEFT, "%d dBm", rssi);
        } else if (pg == 1) {
          it.printf(16, 0, id(font_small), TextAlign::TOP_LEFT, "%s", M_IP[L]);
          it.printf(0, 14, id(font_small), TextAlign::TOP_LEFT, "%s",
                    id(ip_addr).state.empty() ? "-" : id(ip_addr).state.c_str());
        } else if (pg == 2) {
          it.printf(16, 0, id(font_small), TextAlign::TOP_LEFT, "%s", M_TIME[L]);
          auto t = id(sntp_time).now();
          if (t.is_valid())
            it.strftime(0, 11, id(font_small), TextAlign::TOP_LEFT, "%d.%m. %H:%M:%S", t);
          else
            it.printf(0, 11, id(font_small), TextAlign::TOP_LEFT, "%s", M_NOSYNC[L]);
          it.printf(0, 22, id(font_small), TextAlign::TOP_LEFT, "%s", esphome::g_netcfg.ntp);
        } else {
          it.printf(16, 0, id(font_small), TextAlign::TOP_LEFT, "%s", M_SYS[L]);
          it.printf(0, 11, id(font_small), TextAlign::TOP_LEFT, "FW %s", (__DATE__ " " __TIME__));
          it.printf(0, 22, id(font_small), TextAlign::TOP_LEFT, "Up %.0f s",
                    id(uptime_s).has_state() ? id(uptime_s).state : 0.0f);
        }
        return;
      }

      // ----- Normalzustand (kompakt): oben Uhr/Countdown (Mitte) + Status (rechts);
      //        unten Datum (links) + freier Speicher (rechts) -----
      static const char *const ST_FEED[] = {"Futter", "Feed", "Repas", "Voer", "Comida", "Cibo"};
      static const char *const ST_IDLE[] = {"Ruhe", "Idle", "Repos", "Rust", "Reposo", "Riposo"};
      const char *st = (id(remaining) > 0 || id(shelly_trigger).state) ? ST_FEED[L] : ST_IDLE[L];
      it.printf(128, 0, id(font_small), TextAlign::TOP_RIGHT, "%s", st);
      auto t = id(sntp_time).now();
      if (id(remaining) > 0)
        it.printf(64, -3, id(font_big), TextAlign::TOP_CENTER, "%d s", id(remaining));
      else if (t.is_valid())
        it.strftime(64, -3, id(font_big), TextAlign::TOP_CENTER, "%H:%M", t);
      else
        it.printf(64, -3, id(font_big), TextAlign::TOP_CENTER, "--:--");
      if (t.is_valid()) {
        // Wochentage je Sprache (day_of_week: 1=So ... 7=Sa)
        static const char *const WD_DE[] = {"", "So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"};
        static const char *const WD_EN[] = {"", "Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"};
        static const char *const WD_FR[] = {"", "Di", "Lu", "Ma", "Me", "Je", "Ve", "Sa"};
        static const char *const WD_NL[] = {"", "Zo", "Ma", "Di", "Wo", "Do", "Vr", "Za"};
        static const char *const WD_ES[] = {"", "Do", "Lu", "Ma", "Mi", "Ju", "Vi", "Sa"};
        static const char *const WD_IT[] = {"", "Do", "Lu", "Ma", "Me", "Gi", "Ve", "Sa"};
        static const char *const *const WD_ALL[] = {WD_DE, WD_EN, WD_FR, WD_NL, WD_ES, WD_IT};
        const char *const *WD = WD_ALL[L];
        it.printf(0, 31, id(font_small), TextAlign::BASELINE_LEFT, "%s %02d.%02d.%04d",
                  WD[t.day_of_week], (int) t.day_of_month, (int) t.month, (int) t.year);
      }
      it.printf(128, 31, id(font_small), TextAlign::BASELINE_RIGHT, "%u kB",
                (unsigned) (esp_get_free_heap_size() / 1024));
